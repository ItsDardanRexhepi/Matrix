# 0pnMatrx — local development / single-host production compose file.
#
# Usage:
#   cp openmatrix.config.json.example openmatrix.config.json
#   # edit openmatrix.config.json with real keys
#   docker compose up -d
#
# The container reads the mounted config as uid 1000 (Dockerfile `USER
# opnmatrx`). A copy of the .example, or a config `python3 setup.py` created,
# is readable by it under the usual 022 umask. On a Linux host, if the file is
# 600 (a chmod, or a 077 umask), it must be owned by uid 1000
# (`sudo chown 1000 openmatrix.config.json`), or the gateway exits with
# "could not be read".
#
# Persistent state lives in the ``opnmatrx_data`` named volume so the
# SQLite database, daily backups, and any tool workspace files survive
# container rebuilds.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: opnmatrx/gateway:latest
    container_name: opnmatrx-gateway
    restart: unless-stopped
    ports:
      - "18790:18790"
    environment:
      # Sentry / monitoring overrides (optional)
      SENTRY_DSN: "${SENTRY_DSN:-}"
      OPNMATRX_ENV: "${OPNMATRX_ENV:-production}"
      # Provider keys can be passed through the environment instead of
      # baking them into openmatrix.config.json.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      # Mount config read-only so the container can't accidentally rewrite it.
      - ./openmatrix.config.json:/app/openmatrix.config.json:ro
      # Persistent SQLite + backups + tool workspace
      - opnmatrx_data:/app/data
    healthcheck:
      # RUN-7: /ready, not /health. This healthcheck gates Caddy's
      # `depends_on: condition: service_healthy`, which is a ROUTING decision —
      # and /health returns 200 whenever the process is up, even with every
      # model provider unreachable. A 503 raises in urlopen and an unhandled
      # exception exits 1, which is exactly the "unhealthy" signal wanted.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:18790/ready', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  opnmatrx_data:
    driver: local
