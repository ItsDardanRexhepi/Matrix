# The Matrix — local development / single-host production compose file.
#
# Usage:
#   cp matrix.config.json.example matrix.config.json
#   # edit matrix.config.json with real keys
#   docker compose up -d
#
# The container reads the mounted config as uid 1000 (Dockerfile `USER
# the-matrix`). A copy of the .example, or a config `python3 setup.py` created,
# is readable by it under the usual 022 umask. On a Linux host, if the file is
# 600 (a chmod, or a 077 umask), it must be owned by uid 1000
# (`sudo chown 1000 matrix.config.json`), or the gateway exits with
# "could not be read".
#
# Persistent state lives in the ``matrix_data`` named volume so the
# SQLite database, daily backups, and any tool workspace files survive
# container rebuilds.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: the-matrix/gateway:latest
    container_name: matrix-gateway
    restart: unless-stopped
    ports:
      - "18790:18790"
    environment:
      # Sentry / monitoring overrides (optional)
      SENTRY_DSN: "${SENTRY_DSN:-}"
      MATRIX_ENV: "${MATRIX_ENV:-production}"
      # Provider keys can be passed through the environment instead of
      # baking them into matrix.config.json.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Every secret the gateway reads from the environment (the table in
      # runtime/config/validation.py and the bridge in gateway/server.py),
      # passed through from your shell or a .env file beside this one. An unset
      # variable arrives empty, which the gateway reads as unset; in production
      # secret-shaped values in matrix.config.json are stripped, so these are
      # the route by which they reach the container.
      # Gateway, chain and platform signers
      MATRIX_API_KEY: "${MATRIX_API_KEY:-}"
      BASE_RPC_URL: "${BASE_RPC_URL:-}"
      MATRIX_PAYMASTER_KEY: "${MATRIX_PAYMASTER_KEY:-}"
      MATRIX_PAYMASTER_SIGNER_KEY: "${MATRIX_PAYMASTER_SIGNER_KEY:-}"
      MATRIX_DEMO_WALLET_KEY: "${MATRIX_DEMO_WALLET_KEY:-}"
      MATRIX_QR_SECRET: "${MATRIX_QR_SECRET:-}"
      # Model providers
      MATRIX_MODEL_API_KEY: "${MATRIX_MODEL_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      TOGETHER_API_KEY: "${TOGETHER_API_KEY:-}"
      FIREWORKS_API_KEY: "${FIREWORKS_API_KEY:-}"
      CEREBRAS_API_KEY: "${CEREBRAS_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY:-}"
      NOUS_API_KEY: "${NOUS_API_KEY:-}"
      # Apple sign-in and push
      APPLE_PRIVATE_KEY_P8: "${APPLE_PRIVATE_KEY_P8:-}"
      APNS_KEY_ID: "${APNS_KEY_ID:-}"
      APNS_TEAM_ID: "${APNS_TEAM_ID:-}"
      APNS_BUNDLE_ID: "${APNS_BUNDLE_ID:-}"
      # Notifications and social
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      DISCORD_ANNOUNCEMENTS_WEBHOOK: "${DISCORD_ANNOUNCEMENTS_WEBHOOK:-}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_FROM_NUMBER: "${TWILIO_FROM_NUMBER:-}"
      NOTIFY_WEBHOOK_BEARER: "${NOTIFY_WEBHOOK_BEARER:-}"
      TWITTER_API_KEY: "${TWITTER_API_KEY:-}"
      TWITTER_API_SECRET: "${TWITTER_API_SECRET:-}"
      TWITTER_ACCESS_TOKEN: "${TWITTER_ACCESS_TOKEN:-}"
      TWITTER_ACCESS_SECRET: "${TWITTER_ACCESS_SECRET:-}"
      # Data feeds
      WEATHER_API_KEY: "${WEATHER_API_KEY:-}"
      SPORTS_API_KEY: "${SPORTS_API_KEY:-}"
    volumes:
      # Mount config read-only so the container can't accidentally rewrite it.
      - ./matrix.config.json:/app/matrix.config.json:ro
      # Persistent SQLite + backups + tool workspace
      - matrix_data:/app/data
    healthcheck:
      # RUN-7: /ready, not /health. This healthcheck gates Caddy's
      # `depends_on: condition: service_healthy`, which is a ROUTING decision —
      # and /health returns 200 whenever the process is up, even with every
      # model provider unreachable. A 503 raises in urlopen and an unhandled
      # exception exits 1, which is exactly the "unhealthy" signal wanted.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:18790/ready', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  matrix_data:
    driver: local
