name: API Docs

# Build the Python API reference with pdoc when a push to main, or a pull
# request into main, touches a Python file of the documented packages or this
# file, or when the workflow is run by hand. The build fails when pdoc exits
# non-zero, which it does when it cannot import a module. Publishing the result
# to GitHub Pages takes the upload step of the build job and the deploy job;
# both run only while the repository variable PAGES_ENABLED is 'true'. Pages is
# off for this repository, so nothing is published.

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**/*.py'
      - 'gateway/**/*.py'
      - 'hivemind/**/*.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'runtime/**/*.py'
      - 'gateway/**/*.py'
      - 'hivemind/**/*.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build pdoc site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pdoc

      - name: Build API docs
        run: |
          mkdir -p site
          pdoc \
            --output-directory site \
            --docformat google \
            --footer-text "The Matrix — built by Neo" \
            runtime gateway hivemind

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    # Publication is not a test: the build job gates the documentation, and this
    # job only delivers it. It is skipped unless PAGES_ENABLED is 'true'. To
    # publish: Settings -> Pages -> Source: GitHub Actions, then set the
    # repository variable PAGES_ENABLED to true. With the variable true, a
    # deploy that fails fails the run.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
