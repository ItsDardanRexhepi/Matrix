name: Slither

# Static analysis for the Solidity contracts under contracts/.
#
# Runs on every push and PR that touches a .sol file. Findings of severity
# "high" fail the build; lower severities are uploaded as a SARIF report
# so they show up in the repository's Security tab.

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**/*.sol'
      - '.github/workflows/slither.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**/*.sol'
      - '.github/workflows/slither.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Slither compiles the contracts, and they import forge-std,
          # openzeppelin-contracts and account-abstraction from contracts/lib/,
          # which are submodules. Without them the compile finds no imports.
          submodules: recursive

      # contracts/ is a Foundry project (contracts/foundry.toml), so Slither
      # shells out to `forge` to build it. `forge` is not on the runner by
      # default, and without it Slither dies on
      #   FileNotFoundError: [Errno 2] No such file or directory: 'forge'
      # produces no SARIF, and the upload step then fails on the missing file.
      # That is why this workflow had never once gone green.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # Built HERE, on the runner, and not by Slither. crytic-compile's Foundry
      # platform shells out to `forge`, and slither-action is a DOCKER action —
      # the container has no Foundry, so installing it on the host above is not
      # enough on its own and the compile died on
      #   FileNotFoundError: [Errno 2] No such file or directory: 'forge'
      # even after Foundry was installed. So the host builds, and Slither reads
      # the artifacts with ignore-compile.
      - name: Build contracts
        run: forge build
        working-directory: contracts

      - name: Run Slither
        id: slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: 'contracts/'
          slither-version: '0.10.4'
          fail-on: 'high'
          sarif: results.sarif
          ignore-compile: true

      # Guarded on the FILE, not on the output variable. The variable simply
      # echoes the requested filename, so it is non-empty even when Slither
      # produced nothing, and the upload then failed on a path that does not
      # exist — reporting an upload problem for what was really a build problem.
      - name: Upload SARIF report
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: slither
