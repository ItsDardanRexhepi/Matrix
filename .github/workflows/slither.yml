name: Slither

# Static analysis for the Solidity contracts under contracts/.
#
# Runs on every push and PR that touches a .sol file. Findings of severity
# "high" fail the build; everything is uploaded as a SARIF report so it shows up
# in the repository's Security tab.
#
# WHY THIS DOES NOT USE crytic/slither-action. That action runs inside a Docker
# container, and this is a Foundry project: crytic-compile shells out to `forge`
# both to build and to read `forge config`. The container has no Foundry, so
#   * before Foundry was installed on the runner it died on
#     FileNotFoundError: 'forge';
#   * installing Foundry on the RUNNER did not help, because the container
#     cannot see it;
#   * and with --ignore-compile it still could not read `out = "contracts/out"`
#     from foundry.toml — crytic-compile only reads the foundry config INSIDE
#     its compile branch, so ignoring the compile also skips learning where the
#     artifacts are — and it looked for `out/build-info` at the repo root,
#     failing with "out/build-info is not a directory".
# So Slither compiles the project itself, which is what it does correctly when
# `forge` is actually on PATH. `--fail-high` is the real flag; `--fail-on` is an
# input of the action, not of Slither, and passing it to the CLI is an error.
# Slither is installed with pip and run directly on the runner instead, where
# Foundry is on PATH and foundry.toml means what it says. This workflow had
# never once succeeded before that change.

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**/*.sol'
      - 'foundry.toml'
      - '.github/workflows/slither.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**/*.sol'
      - 'foundry.toml'
      - '.github/workflows/slither.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The contracts import forge-std, openzeppelin-contracts and
          # account-abstraction from contracts/lib/, which are submodules.
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Slither
        run: pip install slither-analyzer==0.10.4

      - name: Run Slither
        run: |
          slither . \
            --sarif results.sarif \
            --fail-high \
            --exclude-dependencies

      - name: Upload SARIF report
        # Guarded on the FILE. An output variable that merely echoes the
        # requested filename is non-empty even when nothing was produced, which
        # reported an upload problem for what was really a build problem.
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: slither
