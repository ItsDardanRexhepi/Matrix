# The Matrix — packaging and tooling config.
#
# We keep a minimal setup.py around so ``pip install -e .`` still works
# on older toolchains, but the source of truth for metadata, tool
# config, and optional dependency groups lives here.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-matrix"
dynamic = ["version"]
description = "The Matrix — multi-agent crypto-native platform (Trinity, Neo, Morpheus)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Dardan Rexhepi", email = "242350397+ItsDardanRexhepi@users.noreply.github.com" },
]
keywords = ["blockchain", "agents", "react", "sqlite", "gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # Compatible ranges for `pip install .`. The lower bound is the version the
    # suite runs on; requirements.txt locks that exact point (and the closure).
    # tests/test_dependency_manifests.py keeps the two in agreement and derives
    # this list's completeness from the code's own imports.
    "aiohttp~=3.14",
    "aiofiles~=25.1",
    "web3~=7.16",
    "eth-account~=0.13.7",
    "eth-abi~=6.0",
    "eth-utils~=6.0",
    "py-solc-x~=2.0",
    "pynacl~=1.6",
    "requests~=2.34",
    "python-dotenv~=1.2",
    "pyyaml~=6.0",
    "duckduckgo_search~=8.1",
    "python-telegram-bot~=22.8",
    "cryptography~=50.0",
    "qrcode~=8.2",
    "requests-oauthlib~=2.0",
    "httpx~=0.28.1",
    # Without it Sign in with Apple and App Store receipt verification fail
    # closed on this install path, and the route answers a 401 that looks
    # exactly like a bad token.
    "PyJWT[crypto]~=2.14",
    # Imported directly by gateway/service_routes.py for the batch sub-request's
    # query mapping; it arrives with aiohttp, but a direct import is declared.
    "multidict~=6.7",
]

[project.optional-dependencies]
monitoring = ["sentry-sdk~=2.14"]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "pytest-aiohttp~=1.0",
    "pytest-cov~=5.0",
    "mypy~=1.11",
    "interrogate~=1.7",
    "pdoc~=15.0",
    "pip-audit~=2.7",
    "bandit~=1.7",
    "flake8~=7.1",
]

[project.urls]
Homepage = "https://github.com/ItsDardanRexhepi/Matrix"
Issues = "https://github.com/ItsDardanRexhepi/Matrix/issues"
Changelog = "https://github.com/ItsDardanRexhepi/Matrix/blob/main/CHANGELOG.md"

[project.scripts]
matrix = "cli:main"
matrix-gateway = "gateway.server:main"
matrix-changelog = "scripts.generate_changelog:main"

[tool.setuptools.dynamic]
# Derived, never restated — the number lives in runtime/__init__.py.
version = { attr = "runtime.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "runtime*", "gateway*", "hivemind*", "contracts*", "scripts*", "sdk*"]
exclude = ["tests*", "data*", "memory*", "site*", ".venv*"]

# ── Pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# ── Coverage ────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["runtime", "gateway", "hivemind"]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/migration/*",
    "*/examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 1
show_missing = true
skip_covered = false

# ── mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.9"
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
ignore_missing_imports = true
follow_imports = "silent"
files = ["runtime", "gateway", "hivemind"]
# This codebase wasn't written type-first — keep the check non-strict
# and opt in on a per-module basis once we clean things up.
check_untyped_defs = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "runtime.db.*",
    "runtime.monitoring.*",
    "runtime.auth.session_store",
]
check_untyped_defs = true
disallow_untyped_defs = false

# ── Interrogate (docstring coverage) ────────────────────────────────
[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-module = false
ignore-nested-functions = true
ignore-private = true
ignore-property-decorators = true
ignore-semiprivate = true
fail-under = 60
exclude = [
    "tests",
    "build",
    "docs",
    "migration",
    "examples",
    ".venv",
    "data",
    "memory",
]
verbose = 1
quiet = false
color = true
